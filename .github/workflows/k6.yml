# Load test against the live app (KAN-55). Manual only (Actions → k6 → Run workflow),
# never on PRs or merges, so normal work doesn't put load on production.
# While k6 runs, the job also samples `docker stats` on the server over SSH, using the
# same short-lived access as the deploy job (OIDC, port 22 opened for this runner only).
name: k6

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Site to test'
        default: 'https://splitlah.duckdns.org'

permissions:
  contents: read

jobs:
  k6:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The AWS role and the SSH key only work for the production environment (docs/infra.md)
    environment: production
    permissions:
      id-token: write # for the OIDC token AWS checks
      contents: read
    env:
      EC2_HOST: ${{ vars.EC2_HOST }}
      EC2_SG_ID: ${{ vars.EC2_SG_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: grafana/setup-k6-action@c47136d33d365efbeb9ae7266908b5dcf98cdece # v1.3.0

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-1

      - name: Open SSH for this runner
        id: ssh-rule
        run: |
          RUNNER_IP="$(curl -fsS https://checkip.amazonaws.com)"
          RULE="$(jq -nc --arg cidr "$RUNNER_IP/32" --arg desc "GitHub Actions k6 run $GITHUB_RUN_ID" \
            '[{IpProtocol: "tcp", FromPort: 22, ToPort: 22, IpRanges: [{CidrIp: $cidr, Description: $desc}]}]')"
          aws ec2 authorize-security-group-ingress --group-id "$EC2_SG_ID" --ip-permissions "$RULE"
          echo "cidr=$RUNNER_IP/32" >> "$GITHUB_OUTPUT"

      - name: Set up the SSH key
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      # Server CPU/RAM is sampled in the background about every 10 s (the first sample is
      # before any load), while k6 runs in front. tee keeps the summary for the report;
      # pipefail keeps a failed threshold failing the job.
      - name: Run k6 and sample the server
        env:
          BASE_URL: ${{ inputs.base_url }} # via env, not pasted into the script (injection)
        run: |
          set -o pipefail
          ssh -i ~/.ssh/deploy_key "deploy@$EC2_HOST" 'free -m; for i in $(seq 0 7); do
              echo; date -u +%T
              docker stats --no-stream --format "table {{.Name}}\t{{.CPUPerc}}\t{{.MemUsage}}"
              sleep 8
            done' > server-stats.txt &
          k6 run -e BASE_URL="$BASE_URL" infra/k6/smoke.js | tee k6-summary.txt
          wait
          cat server-stats.txt

      - name: Close SSH again
        if: always() && steps.ssh-rule.outputs.cidr != ''
        run: |
          aws ec2 revoke-security-group-ingress --group-id "$EC2_SG_ID" \
            --protocol tcp --port 22 --cidr "${{ steps.ssh-rule.outputs.cidr }}"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: k6-summary
          path: |
            k6-summary.txt
            server-stats.txt
          retention-days: 30
