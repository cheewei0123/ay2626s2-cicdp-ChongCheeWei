# Load test against the live app (KAN-55). Manual only (Actions → k6 → Run workflow),
# never on PRs or merges, so normal work doesn't put load on production.
name: k6

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Site to test'
        default: 'https://splitlah.duckdns.org'

permissions:
  contents: read

jobs:
  k6:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: grafana/setup-k6-action@c47136d33d365efbeb9ae7266908b5dcf98cdece # v1.3.0
      # tee keeps the summary for the report; pipefail keeps a failed threshold failing the job
      - name: Run k6
        env:
          BASE_URL: ${{ inputs.base_url }} # via env, not pasted into the script (injection)
        run: |
          set -o pipefail
          k6 run -e BASE_URL="$BASE_URL" infra/k6/smoke.js | tee k6-summary.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: k6-summary
          path: k6-summary.txt
          retention-days: 30
