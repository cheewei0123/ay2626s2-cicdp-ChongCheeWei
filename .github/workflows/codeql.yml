name: CodeQL

# Reads our code for security bugs (injection, unsafe regex, leaking data…).
# Results go to the repo's Security tab; a new HIGH finding fails the PR check.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 1 * * 1' # Mondays 09:00 Singapore time: new rules can find old bugs

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: codeql ${{ matrix.language }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # Our TypeScript (api + web), and the workflow files themselves
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none # TypeScript is read as source; nothing to compile
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
