name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same branch cancels the run that is still going
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Scans every commit for leaked secrets (API keys, passwords, tokens)
  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # lets Gitleaks comment on the PR line with the leak
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history, so old commits are scanned too
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint:
    name: lint ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint -w apps/${{ matrix.app }}
      - run: npx prettier --check apps/${{ matrix.app }}
      # Tests run without type-checking, so a type error can pass every test.
      # These two steps catch it (job keeps its name: the ruleset requires "lint api" / "lint web").
      - run: npm run typecheck -w apps/${{ matrix.app }}
      - run: npm run build -w apps/${{ matrix.app }}

  test-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:cov -w apps/api
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-api
          path: apps/api/coverage

  test-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test -w apps/web

  # Builds the API image (no push), so a broken Dockerfile is caught before merging
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          # Reuse layers from earlier runs (stored in GitHub's cache), e.g. npm ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The real API against a real Postgres: every route, guard and query, not just the logic
  test-e2e:
    runs-on: ubuntu-latest
    # A fresh, empty database just for this run, thrown away afterwards
    services:
      postgres:
        image: postgres:18 # same version as local Docker and Amazon RDS
        env:
          POSTGRES_USER: splitlah
          POSTGRES_PASSWORD: splitlah # only exists inside this throwaway container
          POSTGRES_DB: splitlah
        ports:
          - 5432:5432
        # Wait until Postgres accepts connections before the steps start
        options: >-
          --health-cmd "pg_isready -U splitlah"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://splitlah:splitlah@localhost:5432/splitlah?schema=public
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # A random JWT secret for this run only, so no secret is ever written in this file
      - run: echo "JWT_SECRET=$(openssl rand -base64 48)" >> "$GITHUB_ENV"
      # Same command production will use: apply every committed migration in order
      - run: npx prisma migrate deploy
        working-directory: apps/api
      - run: npm run test:e2e -w apps/api
