name: CI

on:
  pull_request:
  push:
    branches: [main]

# Every job's token can only read the code, unless the job asks for more itself
# (gitleaks: comment on the PR; trivy: upload to the Security tab; publish QA report: Pages)
permissions:
  contents: read

# A new push to the same branch cancels the run that is still going
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Scans every commit for leaked secrets (API keys, passwords, tokens)
  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # lets Gitleaks comment on the PR line with the leak
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history, so old commits are scanned too
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint:
    name: lint ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint -w apps/${{ matrix.app }}
      - run: npx prettier --check apps/${{ matrix.app }}
      # Tests run without type-checking, so a type error can pass every test.
      # These two steps catch it (job keeps its name: the ruleset requires "lint api" / "lint web").
      - run: npm run typecheck -w apps/${{ matrix.app }}
      - run: npm run build -w apps/${{ matrix.app }}

  test-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Also writes the counts as JSON and coverage/lcov.info for the QA report (KAN-102)
      - run: npm run test:cov -w apps/api -- --reporter=default --reporter=json --outputFile.json=test-results.json
      # Uploaded even when a test fails, so the QA report shows the failure
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-api
          path: |
            apps/api/coverage
            apps/api/test-results.json

  test-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test -w apps/web -- --reporter=default --reporter=json --outputFile.json=test-results.json
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-web
          path: |
            apps/web/coverage
            apps/web/test-results.json

  # Builds the API image (no push), so a broken Dockerfile is caught before merging
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          # Reuse layers from earlier runs (stored in GitHub's cache), e.g. npm ci.
          # Each Dockerfile has its own scope: with one shared scope, each build replaced
          # the other's cache record, so the web build never found its Caddy layer.
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      # The migration image too, so a broken migrate stage is caught before merging
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/api/Dockerfile
          target: migrate
          push: false
          cache-from: type=gha,scope=api # its layers are the api build stage, saved above
      # The web image (React build + Caddy), so a broken Caddyfile or build can't merge
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  # The real API against a real Postgres: every route, guard and query, not just the logic
  test-e2e:
    runs-on: ubuntu-latest
    # A fresh, empty database just for this run, thrown away afterwards
    services:
      postgres:
        image: postgres:18 # same version as local Docker and Amazon RDS
        env:
          POSTGRES_USER: splitlah
          POSTGRES_PASSWORD: splitlah # only exists inside this throwaway container
          POSTGRES_DB: splitlah
        ports:
          - 5432:5432
        # Wait until Postgres accepts connections before the steps start
        options: >-
          --health-cmd "pg_isready -U splitlah"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://splitlah:splitlah@localhost:5432/splitlah?schema=public
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # A random JWT secret for this run only, so no secret is ever written in this file
      - run: echo "JWT_SECRET=$(openssl rand -base64 48)" >> "$GITHUB_ENV"
      # Same command production will use: apply every committed migration in order
      - run: npx prisma migrate deploy
        working-directory: apps/api
      # With coverage since KAN-103 (no gate): what the real routes and database reach
      - run: npm run test:e2e -w apps/api -- --coverage --reporter=default --reporter=json --outputFile.json=e2e-results.json
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results
          path: |
            apps/api/e2e-results.json
            apps/api/coverage-e2e

  # The top of the test pyramid (KAN-53): the real images (Caddy, API, Postgres) in Docker,
  # driven by real phone browsers: WebKit as an iPhone 14 and, since KAN-103, Chromium as
  # a Pixel 7. axe checks the main screens for accessibility (WCAG 2.1 A and AA).
  e2e-browser:
    runs-on: ubuntu-latest
    env:
      COMPOSE: docker compose -f infra/docker-compose.ci.yml
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Same order as a deploy: database, then migrations, then the app
      - name: Start the app on http://localhost:8080
        run: |
          $COMPOSE up -d --wait db
          $COMPOSE run --rm migrate
          $COMPOSE up -d --wait api web
          # The test reads the verify link from the API log; this keeps a copy in a file
          nohup $COMPOSE logs -f --no-color api > api.log 2>&1 &
      # Microsoft's Playwright image already has WebKit and the system libraries it
      # needs. `playwright install --with-deps` downloaded those from the Ubuntu mirror,
      # which took 30 minutes in two runs (KAN-100). The image tag follows the
      # installed @playwright/test, so a Dependabot bump keeps the two in step.
      - name: Run the browser tests in the Playwright image
        run: |
          version=$(node -p "require('@playwright/test/package.json').version")
          docker run --rm --network host --ipc=host \
            -e CI -e API_LOG=/work/api.log \
            -v "$PWD":/work -w /work/apps/web \
            "mcr.microsoft.com/playwright:v$version-noble" \
            npx playwright test
      # Playwright's HTML report and its counts, for the QA report (KAN-102)
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/playwright-results.json
      # On failure: the trace (open it at trace.playwright.dev) and the video
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-trace
          path: apps/web/test-results
          retention-days: 7
      - if: failure()
        run: $COMPOSE logs api

  # Mutation testing (KAN-103): Stryker changes the split engine (the money maths) in
  # small ways, a + into a -, a < into a <=, and checks that a unit test fails for each.
  # Coverage shows a line ran; this shows the tests would notice it going wrong.
  # Fails below a 70% mutation score (stryker.config.json); not a required check.
  mutation:
    name: mutation testing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx stryker run
        working-directory: apps/api
        # Vitest adds a job summary on GitHub; Stryker runs it once per change, so turn it off
        env:
          GITHUB_ACTIONS: 'false'
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: mutation
          path: apps/api/reports/mutation

  # Checks of the running app (KAN-103), on the same Docker stack as the browser tests:
  # an OWASP ZAP baseline scan (it crawls the app and checks every response, without
  # attacking it) and Lighthouse on the login page. Reported on the QA page, not required.
  web-scan:
    name: ZAP and Lighthouse
    runs-on: ubuntu-latest
    env:
      COMPOSE: docker compose -f infra/docker-compose.ci.yml
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Start the app on http://localhost:8080
        run: |
          $COMPOSE up -d --wait db
          $COMPOSE run --rm migrate
          $COMPOSE up -d --wait api web
      # ZAP's own image, pinned to a release. -I: warnings don't fail the job; the QA
      # report lists every alert. It writes zap.json and zap.html into scan/.
      - name: ZAP baseline scan
        run: |
          mkdir -p scan && chmod 777 scan
          docker run --rm --network host -v "$PWD/scan":/zap/wrk:rw \
            ghcr.io/zaproxy/zaproxy:2.16.1 \
            zap-baseline.py -t http://localhost:8080 -J zap.json -r zap.html -I
      # Lighthouse (pinned) with the runner's own Chrome, as a phone (the default)
      - name: Lighthouse on the login page
        run: |
          npx --yes lighthouse@13.6.0 http://localhost:8080/login \
            --output json --output html --output-path scan/lighthouse \
            --chrome-flags="--headless=new --no-sandbox" --quiet
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: web-scan
          path: scan

  # The QA report (KAN-102): reads the results of every CI job and the lcov.info files
  # and builds the site in qa/site. It runs even when a job failed, so the report shows it.
  qa-report:
    name: QA report
    needs:
      [
        gitleaks,
        lint,
        test-api,
        test-web,
        test-e2e,
        e2e-browser,
        docker-build,
        npm-audit,
        trivy,
        mutation,
        web-scan,
      ]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    env:
      NEEDS: ${{ toJSON(needs) }} # each job's result, for the "every check" table
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The report's own code is checked like the apps' code
      - run: npx prettier --check qa
      - run: npm run qa:typecheck
      - run: npm run qa:test
      # Each artifact goes back where its job wrote it; one that is missing (its job
      # stopped early) shows as "Not run" on the page instead of stopping the report
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: coverage-api
          path: apps/api
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: coverage-web
          path: apps/web
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: e2e-results
          path: apps/api
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: playwright-report
          path: apps/web
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: mutation
          path: apps/api/reports/mutation
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: web-scan
          path: scan
      - run: npm run qa:report
      # Saved as the github-pages artifact; only a push to main publishes it (below)
      - uses: actions/upload-pages-artifact@v5
        with:
          path: qa/site

  # Publishes the QA report to GitHub Pages after a merge to main. Pull requests only
  # build it: their report can be downloaded from the run as the github-pages artifact.
  publish-qa-report:
    name: publish QA report
    needs: qa-report
    if: ${{ !cancelled() && needs.qa-report.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write # publish to Pages
      id-token: write # prove to Pages that the upload came from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # Known vulnerabilities in our npm packages (the lockfile), fails on HIGH or CRITICAL
  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      # npm audit through audit-ci (pinned), which can accept a single advisory with a
      # reason (audit-ci.jsonc). Reads package-lock.json only, so no npm ci is needed.
      - run: npx --yes audit-ci@7.1.0 --config audit-ci.jsonc

  # Known vulnerabilities in what we ship: the OS packages and binaries in each image
  trivy:
    name: trivy ${{ matrix.image }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload the results to the Security tab
    strategy:
      fail-fast: false # one image failing still shows the other's results
      matrix:
        image: [api, web]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Same Dockerfile as the deploy; the layers come from docker-build's cache
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/${{ matrix.image }}/Dockerfile
          load: true # keep the image on this runner so Trivy can scan it
          tags: splitlah-${{ matrix.image }}:scan
          cache-from: type=gha,scope=${{ matrix.image }}
      # Pinned to a full commit SHA, not a tag: in March 2026 attackers moved 76 of this
      # action's tags to malware (CVE-2026-33634). A commit SHA can't be moved.
      - name: Scan (fails on HIGH or CRITICAL with a fix available)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          trivyignores: .trivyignore.yaml # accepted risks, see docs/security.md
          version: v0.76.2
          image-ref: splitlah-${{ matrix.image }}:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true # nothing to do until a fix exists
          exit-code: 1
      # The same scan as SARIF, so every finding shows in the Security tab
      - name: Scan for the Security tab
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          trivyignores: .trivyignore.yaml
          version: v0.76.2
          image-ref: splitlah-${{ matrix.image }}:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: sarif
          output: trivy-${{ matrix.image }}.sarif
          limit-severities-for-sarif: true
          skip-setup-trivy: true # installed by the step above
      - if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-${{ matrix.image }}.sarif
          category: trivy-${{ matrix.image }}
