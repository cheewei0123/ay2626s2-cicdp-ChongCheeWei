# Dependabot opens PRs to update dependencies; each PR goes through CI like any other.
version: 2
updates:
  # npm workspaces share one lockfile at the root, so Dependabot scans from there
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: 'KAN-22 chore(deps)'
    groups:
      # A package goes into the FIRST group it matches, so these come first.
      # Packages that must stay on the same version are always updated together,
      # including major updates (vitest 4 + coverage-v8 5 broke test-api).
      vitest:
        patterns: ['vitest', '@vitest/*']
      prisma:
        patterns: ['prisma', '@prisma/*']
      # One PR for all other minor and patch updates; major updates get their own PR
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: 'KAN-22 chore(ci)'

  # Base image in the API Dockerfile (node:24-slim), e.g. security patches
  - package-ecosystem: docker
    directory: /apps/api
    schedule:
      interval: weekly
    commit-message:
      prefix: 'KAN-36 chore(docker)'
